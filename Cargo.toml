[workspace]
resolver = "2"
members = [
    "crates/cairn-cli",
    "crates/cairn-daemon",
    "crates/cairn-fmt",
    "crates/cairn-scip",
    "crates/cairn-store",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
cairn-scip = { path = "crates/cairn-scip" }
cairn-store = { path = "crates/cairn-store" }
cairn-fmt = { path = "crates/cairn-fmt" }
cairn-daemon = { path = "crates/cairn-daemon" }

anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Platform bindings. Each is pulled in only under the matching `[target.'cfg(..)']`
# section, so neither ends up in the dependency graph of the other platform.
libc = "0.2"
# AF_UNIX on Windows (10 build 17063+). Chosen over named pipes because it is a real
# socket, so the read/write timeouts the daemon protocol depends on still work.
uds_windows = "1.1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
opt-level = 3
lto = "thin"
