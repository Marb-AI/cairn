[package]
name = "cairn-scip"
version.workspace = true
edition.workspace = true
license.workspace = true

# Comments in the vendored scip.proto contain code-like prose that prost turns into
# doctests; they are not ours to fix and they are not testing our code.
[lib]
doctest = false

[dependencies]
anyhow.workspace = true
prost = "0.13"

[build-dependencies]
prost-build = "0.13"
# prost-build stopped shipping protoc in 0.11, so without this the crate only builds on
# a machine that happens to have one. Vendoring it keeps `cargo build` working on a bare
# release runner and for anyone who has not got the dev image.
protoc-bin-vendored = "3"
