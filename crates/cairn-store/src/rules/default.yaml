# Operator settings. Conventions are below; these change what cairn does rather than what
# it understands.
config:
  # Append one line per command to .cairn/sessions/<id>.jsonl: what was asked, how it went,
  # how long it took. Never the answer itself - names, counts and timings only, so the log
  # stays small and carries nothing you would not want to keep.
  #
  # Off by default. A tool that starts recording what you searched for without being asked
  # is one people stop trusting.
  tracking: false
  # Print peak resident memory to stderr when a command finishes.
  memory_peak: false

# cairn's built-in conventions.
#
# Everything here was once an `if` chain in the crate. It is data so that a repository that
# does not follow these conventions can say so without a rebuild, and so that adding a
# language is a pack rather than a patch (architecture D16).
#
# Copy this file to `.cairn/rules.yaml` and edit to override. It is all-or-nothing: the
# file you provide replaces this one entirely.

generated:
  # Matched case-insensitively, in the leading comment block only.
  markers:
    - "code generated by"
    - "do not edit"
    - "@generated"
    - "auto-generated"
    - "autogenerated"
    - "automatically generated"
    - "generated by the protocol buffer compiler"
    - "this file is generated"
    - "generated file"
  # Only consulted when the file itself cannot be read.
  path_suffixes: [".pb.go", "_pb2.py", "_pb2_grpc.py", "_pb2.pyi"]

tests:
  path_contains: ["/tests/", "/testdata/"]
  path_prefixes: ["tests/"]
  file_prefixes: ["test_"]
  file_suffixes: ["_test.go", "_test.py", ".test.ts", ".spec.ts"]

# First match wins, so order is meaning.
commands:
  - name: python-module
    argv0_starts_with: ["python"]
    target: { kind: module_after_flag, flag: "-m" }

  - name: asgi-wsgi-server
    argv0_ends_with: ["uvicorn", "gunicorn", "hypercorn", "daphne"]
    target: { kind: module_before_colon }

  - name: held-open
    command_starts_with: ["tail -f", "sleep infinity", "sleep inf"]
    target: { kind: idle }

  - name: django-management-command
    word_ends_with: "manage.py"
    target: { kind: subcommand_after_match }

  - name: celery
    argv0_ends_with: ["celery"]
    target: { kind: app_after_flag, flag: "-A" }

  - name: built-binary
    target: { kind: binary }

proto:
  # Checked in order: the prefixed form must come before the bare suffix it contains.
  bindings:
    - { prefix: "Register", suffix: "Server", role: serves }   # grpc-go registration
    - { suffix: "Base", role: serves }                          # betterproto2 server base
    - { suffix: "Server", role: serves }                        # grpc-go server interface
    - { suffix: "Stub", role: calls }                           # betterproto2 client
    - { suffix: "Client", role: calls }                         # grpc-go client
  # Removed from a stem before folding it onto its service declaration.
  strip_prefixes:
    - "New"                          # constructor: NewChatServiceClient
    - "mustEmbedUnimplemented"       # grpc-go guard method
    - "MustEmbedUnimplemented"
    - "Unimplemented"                # forward-compatibility base
    - "Unsafe"
  # protoc derives every artefact from `service Foo`; without this marker any name ending
  # in Client becomes a service and the graph fills with edges that do not exist.
  service_marker: "Service"

on_demand:
  # How a scheduled line names the container it runs in: `docker ps -f name=<service>`.
  service_marker: "name="
  runner_suffixes: [".sh"]
  skip_dirs:
    - ".git"
    - "node_modules"
    - ".venv"
    - "venv"
    - "__pycache__"
    - "target"
    - "dist"
    - "build"
    - ".mypy_cache"
    - ".ruff_cache"
    - ".pytest_cache"
